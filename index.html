<meta name="apple-mobile-web-app-capable" content="yes">

<div id="app">

    <button id="theme-btn" class="topbar-btn" type="button" title="切换深浅色" aria-label="切换深浅色">🌙</button>

      <button id="ios-install-close" class="ios-install-close" type="button">知道了</button>

  </div>

  <main id="view" class="view"><div class="loading">加载中…</div></main>

  <!-- 底部标签栏：拇指可达的主导航（移动端惯例） -->

  <!-- Android 自定义安装条：捕获 beforeinstallprompt，用户产生价值后出现 -->
  <div id="install-bar" class="install-bar" hidden>
    <span class="install-text">装到主屏幕，离线随时用</span>
    <button id="install-go" class="install-go" type="button">安装</button>
    <button id="install-close" class="install-close" type="button" aria-label="关闭安装提示">✕</button>
  </div>
</div>
